<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reportar un problema | Custodia</title>
    <link rel="stylesheet" href="../styles/main.css">
</head>
<body>
    <div class="screen">
        <header class="app-header">
            <a class="app-header__brand" href="../index.html">
                <img class="app-header__logo" src="../Public/Iconos/verified_user_30dp_FFFFFF_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                Custodia
            </a>
            <a class="app-header__link" href="#">Ayuda</a>
        </header>

        <main class="screen__content">
            <h1 class="page-title">Contanos qué pasó</h1>
            <p class="page-subtitle">Elegí la opción que mejor describe el problema.</p>

            <div class="alert alert--error" id="form-alert" role="alert"></div>

            <form class="form" id="reporte-form" novalidate>
                <!-- Las opciones se cargan desde reporte.js según el rol de la cuenta -->
                <fieldset class="option-list" id="motivos">
                    <legend class="visually-hidden">Motivo del reporte</legend>
                </fieldset>

                <div class="field" id="detalle-field" hidden>
                    <div class="field__header">
                        <label class="field__label" for="descripcion">Contanos un poco más</label>
                        <span class="field__tag">Obligatorio</span>
                    </div>
                    <textarea class="input" id="descripcion" name="descripcion"
                              placeholder="Describí brevemente el problema" maxlength="500"></textarea>
                    <p class="field__error">Describí el problema.</p>
                </div>

                <div class="screen__actions">
                    <button class="btn btn--accent btn--block" type="submit">Enviar reporte</button>
                    <a class="btn btn--outline btn--block" id="llamar-btn" href="#">
                        <img class="btn__icon" src="../Public/Iconos/call_30dp_0F3D5E_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                        Llamar para ayuda
                    </a>
                    <p class="notice">
                        <img class="notice__icon" src="../Public/Iconos/verified_user_30dp_0F3D5E_FILL0_wght400_GRAD0_opsz24.svg" alt="">
                        Mientras lo revisamos, tu dinero sigue protegido
                    </p>
                </div>
            </form>
        </main>
    </div>

    <script src="../js/api.js"></script>
    <script src="../js/ui.js"></script>
    <script src="../js/reporte.js"></script>
</body>
</html>
